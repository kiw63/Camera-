
name: Build and deploy BLINK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build BLINK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check package lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json tidak ditemukan."
            echo "Buat package-lock.json sebelum menggunakan npm ci."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build -- --base=/Camera-/

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan!"
            exit 1
          fi
          echo "Build berhasil. Isi folder dist:"
          ls -lah dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy BLINK
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
